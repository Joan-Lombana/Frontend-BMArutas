name: 🚀 Full Deploy - Angular + NestJS Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------
      # 1️⃣ Clonar código del repositorio
      # -------------------------------
      - name: 🧩 Checkout del código
        uses: actions/checkout@v4

      # -------------------------------
      # 2️⃣ Configurar Node.js (para frontend)
      # -------------------------------
      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      # -------------------------------
      # 3️⃣ Instalar dependencias Angular
      # -------------------------------
      - name: 📦 Instalar dependencias del frontend
        working-directory: ./Frontend
        run: npm ci

      # -------------------------------
      # 4️⃣ Compilar Angular (producción)
      # -------------------------------
      - name: 🏗️ Compilar Angular
        working-directory: ./Frontend
        run: |
          rm -rf dist
          npm run build -- --configuration production --base-href /


      # -------------------------------
      # 5️⃣ Configurar acceso SSH
      # -------------------------------
      - name: 🔑 Configurar acceso SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      # -------------------------------
      # 6️⃣ Subir frontend a Apache
      # -------------------------------
      - name: 🚚 Desplegar frontend
        run: |
          echo "📤 Subiendo frontend..."

          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          'mkdir -p /tmp/eco_frontend/'

          scp -o StrictHostKeyChecking=no -r Frontend/dist/browser/* \
          ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/eco_frontend/

          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            echo "🧹 Limpiando carpeta web..."
            sudo rm -rf /var/www/frontend/*
            sudo cp -r /tmp/eco_frontend/. /var/www/frontend/

            echo "🔄 Reiniciando nginx..."
            sudo systemctl restart nginx

            echo "✅ Deploy completado"
          '

     