<div class="landing-page split-layout">

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar" [class.scrolled]="isScrolled()">
    <div class="navbar-container">
      <!-- Logo y Nombre -->
      <div class="nav-brand">
        <div class="logo">
          <!-- TODO: Actualizar logo si es necesario -->
          <img src="logo.png" alt="BMArutas Logo"/>
        </div>
        <span class="brand-name">BMArutas</span>
      </div>
      <!-- Enlaces (Opcional, según diseño) -->
      <div class="nav-links">
        <a href="#">Términos</a>
        <a href="#">Planes</a>
        <a href="#">Contacto</a>
      </div>
    </div>
  </nav>

  <!-- ========== SPLIT CONTAINER ========== -->
  <div class="split-container">
    
    <!-- Lado Izquierdo: Textos -->
    <div class="split-left fade-in-up">
      <h1 class="split-title">Rápido, Eficiente y Productivo</h1>
    </div>

    <!-- Lado Derecho: Tarjeta de Login -->
    <div class="split-right">
      <div class="glass-card zoom-in">
        <app-login></app-login>
      </div>
    </div>

  </div>
</div>
