<div class="login-wrapper">
  
  <div class="form-header">
    <h1 class="form-title">Iniciar Sesión</h1>
    <p class="form-subtitle">Acceso al Panel de Administración</p>
  </div>

  @if (errorMessage()) {
    <div class="error-message">
      {{ errorMessage() }}
    </div>
  }

  <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="auth-form">

    <div class="form-group">
      <label class="form-label">Correo Electrónico</label>
      <input
        type="email"
        name="correo"
        [(ngModel)]="loginData.correo"
        required
        class="form-input"
        placeholder="correo electronico"
      >
    </div>

    <div class="form-group">
      <label class="form-label">Contraseña</label>
      <div class="input-password-wrapper">
        <input
          type="password"
          name="password"
          [(ngModel)]="loginData.password"
          required
          class="form-input"
          placeholder="••••••••"
        >
      </div>
      <span class="hint-text">Usa 8 o más caracteres con una mezcla de letras, números y símbolos.</span>
    </div>

    <!-- Separador Opcional si agregas login social a futuro -->
    <!-- <div class="separator"><span>Or with</span></div> -->

    <button
      type="submit"
      class="btn-submit"
      [disabled]="loginForm.invalid || isLoading()"
    >
      Ingresar
    </button>

  </form>
</div>
